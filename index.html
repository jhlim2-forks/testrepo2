<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    body { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif; color: #222; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .7rem; }
    #due { flex: 0 0 auto; }
    label { align-self: center; white-space: nowrap; }
    button { padding: .7rem 1rem; }
    li label { white-space: normal; }
    li input { flex: none; padding: 0; }
    li input:not([type]) { padding: .2rem; }
    li button { padding: .2rem .6rem; }
    li.done { opacity: .5; }
    #error { color: #b42318; min-height: 1.5em; }
    li { padding: .5rem 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>할 일 목록</h1>
  <form id="todo-form">
    <input id="title" aria-label="할 일 제목" placeholder="할 일을 입력하세요" maxlength="200">
    <label for="due">마감일(선택)</label>
    <input type="date" id="due">
    <button type="submit">추가</button>
  </form>
  <p id="error" role="alert"></p>
  <p id="remaining-count" hidden></p>
  <ul id="todos"></ul>
  <p id="empty-message" hidden>아직 할 일이 없으니 위 입력 칸에서 첫 할 일을 추가해 보세요.</p>
  <script>
    const list = document.getElementById('todos');
    const error = document.getElementById('error');
    const emptyMessage = document.getElementById('empty-message');
    let closeEdit = null;
    const remainingCount = document.getElementById('remaining-count');
    function render(items) {
      list.replaceChildren();
      closeEdit = null;
      emptyMessage.hidden = items.length !== 0;
      remainingCount.textContent = `남은 할 일 ${items.filter(item => item.done !== true).length}개`;
      remainingCount.hidden = items.length === 0;
      for (const item of items) {
        const row = document.createElement('li');
        if (item.done) row.classList.add('done');
        const label = document.createElement('label');
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.done === true;
        checkbox.setAttribute('aria-label', '완료');
        checkbox.addEventListener('change', () => setDone(item.id, checkbox.checked));
        const titleText = document.createElement('span');
        titleText.textContent = item.title;
        label.append(checkbox, ' ', titleText);
        if (item.due) label.append(` · 마감 ${item.due}`);
        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.textContent = '수정';
        editButton.addEventListener('click', () => startEdit(titleText, editButton, item));
        row.append(label);
        row.append(' ', editButton);
        list.append(row);
      }
    }
    function startEdit(titleText, editButton, item) {
      if (closeEdit) closeEdit();
      const editor = document.createElement('span');
      const titleInput = document.createElement('input');
      titleInput.value = item.title;
      titleInput.setAttribute('aria-label', '고칠 제목');
      titleInput.maxLength = 200;
      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.textContent = '저장';
      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.textContent = '취소';
      editor.append(titleInput, ' ', saveButton, ' ', cancelButton);
      titleText.replaceWith(editor);
      editButton.hidden = true;
      closeEdit = () => {
        editor.replaceWith(titleText);
        editButton.hidden = false;
        closeEdit = null;
      };
      saveButton.addEventListener('click', () => saveTitle(item.id, titleInput.value));
      cancelButton.addEventListener('click', () => closeEdit());
      titleInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); saveTitle(item.id, titleInput.value); }
        if (event.key === 'Escape') { event.preventDefault(); closeEdit(); }
      });
      titleInput.focus();
    }
    async function saveTitle(id, title) {
      error.textContent = '';
      const response = await fetch(`/api/todos/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      if (!response.ok) {
        const data = await response.json();
        error.textContent = data.error;
        return;
      }
      await refresh();
    }
    async function setDone(id, done) {
      error.textContent = '';
      const response = await fetch(`/api/todos/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done })
      });
      if (!response.ok) {
        const data = await response.json();
        error.textContent = data.error;
      }
      await refresh();
    }
    async function refresh() {
      const response = await fetch('/api/todos');
      const data = await response.json();
      render(data.todos);
    }
    document.getElementById('todo-form').addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      const input = document.getElementById('title');
      const dueInput = document.getElementById('due');
      const response = await fetch('/api/todos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, due: dueInput.value })
      });
      const data = await response.json();
      if (!response.ok) { error.textContent = data.error; return; }
      input.value = '';
      dueInput.value = '';
      await refresh();
    });
    refresh();
  </script>
</body>
</html>
